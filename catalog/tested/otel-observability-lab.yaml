# External demo. Same stub shape as the in-repo examples; repoURL points
# at the author's GitHub, path is the chart at the repository root.
name: otel-observability-lab
displayName: OpenShift Observability with OpenTelemetry
description: >-
  Multi-user workshop (~90 min) on OpenShift 4.22: Tempo, Loki, Cluster
