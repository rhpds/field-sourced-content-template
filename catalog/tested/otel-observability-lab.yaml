  sampling. Chart is at the repository root.
owner: Natale Vinto (@blues-man)
repoURL: https://github.com/blues-man/openshift-observability-otel-lab.git
revision: main
chartPath: "."
requires:
  virt: false
  rhoai: false
  aap: false
  clusterSize: multinode
